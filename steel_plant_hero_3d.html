
<style>
  @keyframes smoke1 { 0%{transform:translateY(0) scaleX(1);opacity:.7} 100%{transform:translateY(-80px) scaleX(2.5);opacity:0} }
  @keyframes smoke2 { 0%{transform:translateY(0) scaleX(1);opacity:.5} 100%{transform:translateY(-100px) scaleX(3);opacity:0} }
  @keyframes glow-pulse { 0%,100%{opacity:.8;filter:brightness(1)} 50%{opacity:1;filter:brightness(1.4)} }
  @keyframes molten-flow { 0%{opacity:.9;transform:translateY(0)} 50%{opacity:1;transform:translateY(2px)} 100%{opacity:.9;transform:translateY(0)} }
  @keyframes conveyor { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-40} }
  @keyframes spark { 0%,100%{opacity:0;transform:scale(0)} 30%{opacity:1;transform:scale(1)} 60%{opacity:.6;transform:scale(1.5)} }
  @keyframes flicker { 0%,100%{opacity:1} 45%{opacity:.7} 50%{opacity:1} 75%{opacity:.8} }
  @keyframes steam-rise { 0%{transform:translateY(0) scaleX(1);opacity:.6} 100%{transform:translateY(-60px) scaleX(2);opacity:0} }
  @keyframes crane-swing { 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
  @keyframes fan-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  @keyframes sky-pulse { 0%,100%{opacity:.3} 50%{opacity:.55} }
  @keyframes float-particle { 0%{transform:translateY(0) translateX(0);opacity:.8} 100%{transform:translateY(-120px) translateX(20px);opacity:0} }
  @keyframes pipeline-flow { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-30} }
  @keyframes warning-blink { 0%,100%{fill:#ff4500} 50%{fill:#ff9900} }

  .smoke-puff { animation: smoke1 3s ease-out infinite; transform-origin: center bottom; }
  .smoke-puff2 { animation: smoke2 4s ease-out infinite 1s; transform-origin: center bottom; }
  .glow-el { animation: glow-pulse 2s ease-in-out infinite; }
  .molten { animation: molten-flow 1.5s ease-in-out infinite; }
  .conv-line { animation: conveyor 1.2s linear infinite; stroke-dasharray:8 6; }
  .spark1 { animation: spark 1.8s ease-in-out infinite; }
  .spark2 { animation: spark 2.4s ease-in-out infinite .6s; }
  .spark3 { animation: spark 1.5s ease-in-out infinite 1.1s; }
  .flicker { animation: flicker 2s ease-in-out infinite; }
  .steam { animation: steam-rise 2.5s ease-out infinite; transform-origin: center bottom; }
  .steam2 { animation: steam-rise 3s ease-out infinite 1.2s; transform-origin: center bottom; }
  .crane { animation: crane-swing 4s ease-in-out infinite; transform-origin: 0 0; }
  .fan { animation: fan-spin 0.6s linear infinite; transform-origin: center; }
  .sky-glow { animation: sky-pulse 4s ease-in-out infinite; }
  .particle { animation: float-particle 4s ease-out infinite; }
  .particle2 { animation: float-particle 5s ease-out infinite 1.5s; }
  .pipe-flow { animation: pipeline-flow 1s linear infinite; stroke-dasharray:6 4; }
  .warn { animation: warning-blink 1s ease-in-out infinite; }
</style>
